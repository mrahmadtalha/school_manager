<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Something went wrong</title>
    <link href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="card shadow-sm border-0 mx-auto" style="max-width:640px;">
        <div class="card-body p-5 text-center">
            <h1 class="display-6 fw-bold text-danger mb-3">500 — Unexpected error</h1>
            <p class="text-muted mb-4">
                The request could not be completed. Nothing was saved. Check the server log for the
                full traceback, then retry.
            </p>
            <a class="btn btn-dark" href="{{ url_for('main.dashboard') }}">Back to dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
