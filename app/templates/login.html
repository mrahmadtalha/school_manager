<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — School Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #1a1a2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 420px; }
        .login-header { background: #212529; color: #fff; border-radius: 12px 12px 0 0; padding: 2rem; text-align: center; }
        .login-body { background: #fff; border-radius: 0 0 12px 12px; padding: 2rem; }
    </style>
</head>
<body>
<div class="login-card shadow-lg">
    <div class="login-header">
        <i class="fas fa-school fa-3x text-warning mb-3"></i>
        <h4 class="fw-bold mb-0">School Manager</h4>
        <p class="text-secondary small mt-1 mb-0">Sign in to continue</p>
    </div>
    <div class="login-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control" name="username" placeholder="Enter username" required autofocus>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control" name="password" placeholder="Enter password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">
                <i class="fas fa-sign-in-alt me-2"></i> Sign In
            </button>
        </form>
        <p class="text-muted text-center small mt-3 mb-0">Default: <code>admin</code> / <code>admin123</code></p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
