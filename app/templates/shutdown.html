{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow-sm border-0 text-center">
                <div class="card-body py-5">
                    <div class="display-4 text-dark mb-3"><i class="fas fa-power-off"></i></div>
                    <h4 class="mb-2">School Manager is closing</h4>
                    <p class="text-muted mb-4">
                        All data has been saved. You can close this browser tab now —
                        reopen the software from the desktop shortcut any time.
                    </p>
                    <div class="spinner-border text-secondary spinner-border-sm me-2" role="status">
                        <span class="visually-hidden">Closing…</span>
                    </div>
                    <span class="text-muted small">The background server is shutting down…</span>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
