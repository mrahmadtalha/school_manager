{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">School Setup</h4>
                </div>
                <div class="card-body">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Admin username</label>
                                <input type="text" class="form-control" name="username" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">School name</label>
                                <input type="text" class="form-control" name="school_name" value="School Manager" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" name="password" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Confirm password</label>
                                <input type="password" class="form-control" name="confirm_password" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Tagline</label>
                                <input type="text" class="form-control" name="tagline" placeholder="Quality education for all">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Address</label>
                                <textarea class="form-control" name="address" rows="2" placeholder="School address"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" name="phone" placeholder="+92 300 1234567">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" placeholder="info@school.com">
                            </div>
                            <div class="col-md-12">
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="dummy_data" name="dummy_data" checked>
                                    <label class="form-check-label" for="dummy_data">
                                        Load demo classes, sections, teachers, and students for testing
                                    </label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label">Students to generate</label>
                                <input type="number" class="form-control" name="dummy_student_count" min="0" value="60">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Teachers to generate</label>
                                <input type="number" class="form-control" name="dummy_teacher_count" min="0" value="8">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Bulk monthly fee</label>
                                <input type="number" step="0.01" class="form-control" name="dummy_fee" min="0" value="2500">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-4">Finish Setup</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
